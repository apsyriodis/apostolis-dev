<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #f0f9fa 0%, #e0f2f4 50%, #ffffff 100%);
    display: flex;
    align-items: center;
    padding: 80px;
    position: relative;
    overflow: hidden;
  }
  .pattern {
    position: absolute;
    inset: 0;
    opacity: 0.06;
    font-family: monospace;
    font-size: 60px;
    color: #2E7D8F;
    display: flex;
    flex-wrap: wrap;
    gap: 100px;
    padding: 40px;
    line-height: 1;
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 60px;
    width: 100%;
  }
  .text {
    flex: 1;
  }
  .name {
    font-size: 72px;
    font-weight: 800;
    color: #1a2b32;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 20px;
  }
  .name .accent {
    color: #2E7D8F;
  }
  .title {
    font-size: 36px;
    font-weight: 500;
    color: #4a5a62;
    margin-bottom: 32px;
  }
  .tags {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 22px;
    font-weight: 600;
    padding: 10px 20px;
    background: white;
    color: #2E7D8F;
    border: 2px solid #2E7D8F;
    border-radius: 100px;
  }
  .divider {
    height: 5px;
    width: 100px;
    background: #2E7D8F;
    border-radius: 10px;
    margin-bottom: 30px;
  }
  .photo-wrap {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    overflow: hidden;
    border: 8px solid #2E7D8F;
    flex-shrink: 0;
    box-shadow: 0 20px 60px rgba(46, 125, 143, 0.3);
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .footer {
    position: absolute;
    bottom: 40px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    color: #6b7c84;
    z-index: 2;
  }
  .footer .url {
    color: #2E7D8F;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="pattern">
    &lt;/&gt;  {}  =&gt;  []  &lt;&gt;  ()  ::  ==  ++  ;  &lt;/&gt;  {}  =&gt;  []  &lt;&gt;  ()  ::  ==  ++  ;
  </div>

  <div class="content">
    <div class="text">
      <div class="divider"></div>
      <div class="name">
        Apostolis<br><span class="accent">Syriodis</span>
      </div>
      <div class="title">Senior Full Stack Developer</div>
      <div class="tags">
        <span class="tag">Laravel</span>
        <span class="tag">React</span>
        <span class="tag">MySQL</span>
        <span class="tag">Docker</span>
      </div>
    </div>
    <div class="photo-wrap">
      <img src="file:///Users/apsyriodis/Documents/apostolis-dev/public/photo-biography.jpg" alt="Apostolis">
    </div>
  </div>

  <div class="footer">
    <span>Building SaaS platforms from scratch</span>
    <span class="url">apostolis.dev</span>
  </div>
</body>
</html>
